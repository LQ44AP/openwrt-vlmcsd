name: Build vlmcsd (APK)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: mipsel_24kc
            sdk_url: https://downloads.openwrt.org/releases/25.12.5/targets/ramips/mt7621/openwrt-sdk-25.12.5-ramips-mt7621_gcc-14.3.0_musl.Linux-x86_64.tar.zst

          - arch: mips_24kc
            sdk_url: https://downloads.openwrt.org/releases/25.12.5/targets/ath79/generic/openwrt-sdk-25.12.5-ath79-generic_gcc-14.3.0_musl.Linux-x86_64.tar.zst

          - arch: x86_64
            sdk_url: https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst

          - arch: aarch64_generic
            sdk_url: https://downloads.openwrt.org/releases/25.12.5/targets/rockchip/armv8/openwrt-sdk-25.12.5-rockchip-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext \
            libssl-dev xsltproc wget zip unzip rsync python3 \
            libglib2.0-dev-bin libtool pkg-config zlib1g-dev zstd

      - name: Setup SDK
        run: |
          wget -qO sdk.tar.zst "${{ matrix.sdk_url }}"
          mkdir sdk && tar -I zstd -xvf sdk.tar.zst -C sdk --strip-components=1
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a || echo "Ignore core merging warnings"

      - name: Add Package to SDK
        run: |
          mkdir -p sdk/package/vlmcsd
          cp Makefile sdk/package/vlmcsd/
          [ -d files ] && cp -r files sdk/package/vlmcsd/
          # Fix CRLF line endings in vlmcsd directory
          find sdk/package/vlmcsd/ -type f -exec sed -i 's/\r$//' {} +

      - name: Build Package
        run: |
          cd sdk
          make defconfig
          # Compile vlmcsd; fallback to single-thread logging on failure
          make package/vlmcsd/compile V=s -j$(nproc) || make package/vlmcsd/compile V=s -j1

      - name: Collect APK
        run: |
          mkdir -p output
          echo "Searching for compiled .apk / .ipk artifacts..."

          # Find generated packages
          find sdk/bin/packages/ -type f \( -name "vlmcsd*.apk" -o -name "vlmcsd*.ipk" \) -exec cp -t output/ {} +

          cd output
          shopt -s nullglob
          pkg_files=(*.*)

          if [ ${#pkg_files[@]} -eq 0 ]; then
            echo "::error::No APK / IPK files found! Please check the build logs."
            exit 1
          fi

          # Append architecture tag to output file names if missing
          for f in "${pkg_files[@]}"; do
            ext="${f##*.}"
            base="${f%.*}"
            if [[ "$f" != *"${{ matrix.arch }}"* ]]; then
              new_name="${base}_${{ matrix.arch }}.${ext}"
              echo "Renaming: $f -> $new_name"
              mv "$f" "$new_name"
            else
              echo "Skipping already formatted file: $f"
            fi
          done

          echo "Final deliverables:"
          ls -lh .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vlmcsd-${{ matrix.arch }}
          path: output/*

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: output/*
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
